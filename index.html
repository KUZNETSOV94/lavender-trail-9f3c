<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#ffe9f1">
  <title>Анкетка о самочувствии</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="playful">
  <div class="app">
    <div class="topbar" id="topbar" hidden>
      <button type="button" class="btn-back" id="btn-back" aria-label="Назад">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
          <path d="M11.5 3.5 6 9l5.5 5.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <div class="progress">
        <div class="progress-meta" id="prog-meta"></div>
        <div class="trail">
          <div class="trail-fill" id="trail-fill" style="width:0"></div>
          <img class="trail-nyan" id="trail-nyan" src="assets/nyan-fly.png" alt="" style="left:0">
        </div>
      </div>
    </div>
    <main class="screen" id="screen"></main>
  </div>
  <script src="js/questions.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
